[bans]
multiple-versions = "allow"
deny = ["aws-lc", "aws-lc-rs", "aws-lc-sys", "native-tls", "openssl"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                        # BOSL license
    "CDLA-Permissive-2.0",            # Community Data License Agreement Permissive 2.0 due to webpki-root-certs
    "ISC",
    "MIT",
    "Zlib",
    "MPL-2.0",                        # https://fossa.com/blog/open-source-software-licenses-101-mozilla-public-license-2-0/
    "Unicode-3.0",
    "Unlicense",                      # https://unlicense.org/
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
# cargo-deny 0.22 scopes `unmaintained` to the workspace by default. The ignores below are for
# transitive crates, so the scope stays on every crate, as it was before 0.22.
unmaintained = "all"
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained
    # Unmaintained, with no fixed version and no known vulnerability. Path: wmi 0.18.4 (Windows
    # only), through the netwatch fork of net-tools.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no fixed version, no known vulnerability; via wmi 0.18.4 (netwatch fork, Windows only)" },
]

[sources]
allow-git = [
    "https://github.com/agent-habilis/iroh",
    "https://github.com/agent-habilis/net-tools",
    "https://github.com/agent-habilis/noq",
    "https://github.com/agent-habilis/swarm-discovery",
]
