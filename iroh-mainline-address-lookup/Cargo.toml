[package]
name = "iroh-mainline-address-lookup"
version = "0.4.0"
edition = "2024"
readme = "README.md"
description = "BitTorrent Mainline DHT-based address lookup for iroh"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-address-lookups"
homepage = "https://github.com/n0-computer/iroh-address-lookups"
documentation = "https://docs.rs/iroh-mainline-address-lookup"
keywords = ["iroh", "dht", "mainline", "pkarr", "address-lookup"]
categories = ["network-programming"]

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.1", features = ["debug"] }
# FORK: agent-habilis/iroh, not crates.io. See the repo README -- this fork
# exists to repoint the 4 iroh lines in this manifest (3 below, 1 in dev-dependencies).
# Same reasoning as the mdns crate: this sits between habilis-network and iroh, so a
# crates.io edge here puts a second iroh in the graph.
iroh = { version = "=1.0.3", git = "https://github.com/agent-habilis/iroh", rev = "86ff046f4c4937d3629582e3885232c094cd6b07", default-features = false }
iroh-base = { version = "=1.0.3", git = "https://github.com/agent-habilis/iroh", rev = "86ff046f4c4937d3629582e3885232c094cd6b07", default-features = false, features = ["key", "relay"] }
iroh-dns = { version = "=1.0.3", git = "https://github.com/agent-habilis/iroh", rev = "86ff046f4c4937d3629582e3885232c094cd6b07" }
# FORK: n0-mainline 0.8.0 from agent-habilis/n0-mainline main, which equals
# upstream v0.8.0. It fixes the bencode abort on a crafted datagram. Its noq-udp
# requirement resolves to crates.io noq-udp 1.5.0, so the graph has 1 copy.
n0-mainline = { version = "0.8.0", git = "https://github.com/agent-habilis/n0-mainline", rev = "3eae833681713bcd53cc6402f57b4b6a73348ffe" }
n0-error = "1.0.0"
n0-future = "0.3.2"
tokio = { version = "1.49", default-features = false, features = ["sync"] }
tracing = "0.1.44"
url = "2.5.3"

[dev-dependencies]
iroh = { version = "=1.0.3", git = "https://github.com/agent-habilis/iroh", rev = "86ff046f4c4937d3629582e3885232c094cd6b07" }
clap = { version = "4", features = ["derive"] }
n0-tracing-test = "0.3"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]
